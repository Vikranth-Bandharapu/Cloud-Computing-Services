<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Custom 404 Page - Stackly Cloud Services. Page not found.">
    <title>404 - Page Not Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050d21;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            overflow: hidden;
        }
        .error-full-viewport {
            min-height: 100vh;
            width: 100vw;
            background-color: #050d21;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card-reference {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 70px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .error-code-cyan {
            font-size: 7.5rem;
            font-weight: 800;
            color: #00e5ff;
            line-height: 1;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }
        .btn-gradient-purple-pill {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%) !important;
            color: #ffffff !important;
            padding: 14px 36px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }
        .btn-gradient-purple-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.6);
            color: #ffffff !important;
        }
        .btn-gradient-pink-pill {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%) !important;
            color: #ffffff !important;
            padding: 14px 36px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }
        .btn-gradient-pink-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.6);
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- PURE CENTERED 404 VIEWPORT -->
    <main class="error-full-viewport">
        <div class="error-card-reference" data-aos="fade-up">
            <div class="error-code-cyan">404</div>
            <h2 class="text-white font-weight-700 fs-2 mb-4">Oops! The page you're looking for doesn't exist.</h2>
            <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
                <a href="index.html" class="btn-gradient-purple-pill"><i class="fas fa-house me-2"></i>Back to Home</a>
                <a href="javascript:history.back()" class="btn-gradient-pink-pill"><i class="fas fa-arrow-left me-2"></i>Return Back</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/main.js"></script>
    <script src="assets/animations.js"></script>
    <!-- FLOATING INTERACTIVE COLOR THEME SWITCHER WIDGET -->
    <div class="color-theme-widget">
        <span class="color-theme-title"><i class="fas fa-palette me-1"></i> Palette:</span>
        <button class="theme-btn theme-btn-cyan" data-theme-val="cyan" title="Sovereign Cyan"></button>
        <button class="theme-btn theme-btn-purple" data-theme-val="purple" title="Electric Purple"></button>
        <button class="theme-btn theme-btn-emerald" data-theme-val="emerald" title="Emerald Tech"></button>
    </div>
</body>
</html>
