<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure Console Login - Stackly Cloud Platform. Access cloud dashboards, servers, database replication files, and billing stats.">
    <title>Login - Stackly</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        body {
            background-color: var(--secondary-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .auth-page-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- MAIN LOGIN CARD (WITH BACK BUTTON) -->
    <main class="auth-page-container">
        <div class="ref-auth-card">
            <!-- BACK BUTTON (MOVED ABOVE LOGO) -->
            <div class="mb-3">
                <button type="button" onclick="if (document.referrer && document.referrer.indexOf('login.html') === -1 && document.referrer.indexOf('signup.html') === -1 && document.referrer.indexOf('signin.html') === -1) { window.location.href = document.referrer; } else { window.location.href = 'index.html'; }" class="btn-back-auth" aria-label="Go back to previous page">
                    <i class="fas fa-arrow-left me-2"></i> Back
                </button>
            </div>
            
            <!-- CENTERED BRAND LOGO -->
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-block">
                    <img src="assets/stackly_logo.webp" alt="Stackly Cloud Logo" style="height: 42px;">
                </a>
            </div>
            
            <h1 class="mt-2">Login</h1>
            
            <form id="login-form-v3" novalidate>
                <!-- Email Field -->
                <div class="ref-auth-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" class="ref-auth-input" placeholder="Enter your email" required autocomplete="username">
                </div>

                <!-- Password Field -->
                <div class="ref-auth-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="ref-auth-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <!-- Role Selector (2 Roles: User & Admin) -->
                <div class="ref-auth-group">
                    <label for="login-role">Role</label>
                    <select id="login-role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="client">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="ref-auth-btn">Login</button>
            </form>

            <div class="ref-auth-footer">
                Don't have an account? <a href="signup.html">Register here</a>
            </div>
        </div>
    </main>

    <!-- FLOATING INTERACTIVE COLOR THEME SWITCHER WIDGET -->
    <div class="color-theme-widget">
        <span class="color-theme-title"><i class="fas fa-palette me-1"></i> Palette:</span>
        <button class="theme-btn theme-btn-cyan" data-theme-val="cyan" title="Sovereign Cyan"></button>
        <button class="theme-btn theme-btn-purple" data-theme-val="purple" title="Electric Purple"></button>
        <button class="theme-btn theme-btn-emerald" data-theme-val="emerald" title="Emerald Tech"></button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/main.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
</body>
</html>
