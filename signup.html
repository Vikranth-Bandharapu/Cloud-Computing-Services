<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register Profile - Stackly Cloud Platform.">
    <title>Sign In & Register - Stackly</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        body {
            background-color: var(--secondary-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .auth-page-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- MAIN REGISTER CARD (WITH BACK BUTTON) -->
    <main class="auth-page-container">
        <div class="ref-auth-card">
            <!-- BACK BUTTON (MOVED ABOVE LOGO) -->
            <div class="mb-3">
                <button type="button" onclick="if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { history.back(); } else { window.location.href='index.html'; }" class="btn-back-auth" aria-label="Go back to previous page">
                    <i class="fas fa-arrow-left me-2"></i> Back
                </button>
            </div>
            
            <!-- CENTERED BRAND LOGO -->
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-block">
                    <img src="assets/stackly_logo.webp" alt="Stackly Cloud Logo" style="height: 42px;">
                </a>
            </div>
            
            <h1 class="mt-2">Register</h1>
            
            <form id="signup-form-v3" novalidate>
                <!-- Full Name -->
                <div class="ref-auth-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="ref-auth-input" placeholder="Enter your name" required>
                </div>

                <!-- Email Field -->
                <div class="ref-auth-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" class="ref-auth-input" placeholder="Enter your email" required autocomplete="username">
                </div>

                <!-- Password Field -->
                <div class="ref-auth-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="ref-auth-input" placeholder="Create password" required autocomplete="new-password">
                </div>

                <button type="submit" class="ref-auth-btn">Register Account</button>
            </form>

            <div class="ref-auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <!-- FLOATING INTERACTIVE COLOR THEME SWITCHER WIDGET -->
    <div class="color-theme-widget">
        <span class="color-theme-title"><i class="fas fa-palette me-1"></i> Palette:</span>
        <button class="theme-btn theme-btn-cyan" data-theme-val="cyan" title="Sovereign Cyan"></button>
        <button class="theme-btn theme-btn-purple" data-theme-val="purple" title="Electric Purple"></button>
        <button class="theme-btn theme-btn-emerald" data-theme-val="emerald" title="Emerald Tech"></button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/main.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
</body>
</html>
